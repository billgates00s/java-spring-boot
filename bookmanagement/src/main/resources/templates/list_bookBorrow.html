<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="/_admin_fragments :: admin_head"></th:block>
    <title>Quản lý Mượn sách | Admin</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
</head>
<body>

    <div th:replace="/_admin_fragments :: admin_sidebar"></div>

    <div class="main-content">
        <div th:replace="/_admin_fragments :: admin_header"></div>

        <div class="page-container">
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; font-weight: 700;">QUẢN LÝ MƯỢN SÁCH</h2>
                    <a class="btn btn-primary" th:href="@{/bookBorrow/bookBorrow_save}" style="background-color: #3498db; border: none;">
                        <i class="fas fa-plus"></i> LẬP ĐƠN MƯỢN
                    </a>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Book</th>
                        <th>Date Borrow</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bookBorrow : ${listBookBorrow}">
                        <td style="vertical-align: middle;"><span th:text="${bookBorrow.id}"> ID </span></td>
                        <td style="vertical-align: middle;">
                            <span th:text="${bookBorrow.student.name_student}" style="font-weight: 600;"> Student </span>
                        </td>
                        <td style="vertical-align: middle;">
                            <span th:text="${bookBorrow.book.name_book}" style="color: #4682b4; font-weight: 500;"> Book </span>
                        </td>
                        <td style="vertical-align: middle;"><span th:text="${#dates.format(bookBorrow.date_borrow, 'dd/MM/yyyy')}"> Date </span></td>
                        <td style="text-align: center; vertical-align: middle;">
                            <div class="btn-group">
                                <a th:href="@{'/bookBorrow/bookBorrow_view/' + ${bookBorrow.id}}" class="btn btn-info btn-sm">View</a>
                                <a th:href="@{'/bookBorrow/bookBorrow_update/' + ${bookBorrow.id}}" class="btn btn-warning btn-sm" style="margin: 0 5px;">Edit</a>
                                <a th:href="@{'/bookBorrow/deleteBookBorrow/' + ${bookBorrow.id}}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
