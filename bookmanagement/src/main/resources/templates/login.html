<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCSHOP ADMIN | Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="auth-body">

<div class="login-card animate-fade">
    <h1>HCSHOP ADMIN</h1>
    <p>Vui lòng đăng nhập để tiếp tục</p>

    <form th:action="@{/j_spring_security_check}" method="POST">
        
        <div th:if="${param.error}" style="color: #ff5252; margin-bottom: 15px; font-size: 0.9rem;">
            Sai tên đăng nhập hoặc mật khẩu
        </div>

        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Email quản trị" required autofocus>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
        </div>

        <button type="submit">Đăng nhập ngay</button>
        
        <div class="footer-info">
            <p>&copy; 2026 SmashShop. All rights reserved.</p>
            <p style="margin-top: 10px;">
                Chưa có tài khoản? <a th:href="@{/register_user}">Đăng ký ngay</a>
            </p>
        </div>
    </form>
</div>

</body>
</html>
