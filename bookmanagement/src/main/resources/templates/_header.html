<div class="header-container" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

    <div class="site-name">Book Management</div>

    <div class="header-bar">
        <th:block th:if="${#request.userPrincipal == null}">
            <a th:href="@{/login}" class="login-btn">Login</a>
        </th:block>
        
        <th:block th:if="${#request.userPrincipal != null}">
            <span class="user-greeting" style="margin-right: 15px;">
                Hello, <strong sec:authentication="name" style="color: var(--primary);">User</strong>
            </span>
            <a th:href="@{/logout}" class="logout-link">Logout</a>
        </th:block>
    </div>
</div>
