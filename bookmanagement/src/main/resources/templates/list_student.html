<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="/_admin_fragments :: admin_head"></th:block>
    <title>Quản lý Student | Admin</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
</head>
<body>

    <div th:replace="/_admin_fragments :: admin_sidebar"></div>

    <div class="main-content">
        <div th:replace="/_admin_fragments :: admin_header"></div>

        <div class="page-container">
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; font-weight: 700;">QUẢN LÝ STUDENT</h2>
                    <a class="btn btn-primary" th:href="@{/student/student_save}" style="background-color: #3498db; border: none;">
                        <i class="fas fa-plus"></i> ADD STUDENT
                    </a>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name Student</th>
                        <th>Identity Card</th>
                        <th>Address</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${listStudent}">
                        <td style="vertical-align: middle;"><span th:text="${student.studentId}"> ID </span></td>
                        <td style="vertical-align: middle;"><span th:text="${student.name_student}" style="font-weight: 600;"> Name </span></td>
                        <td style="vertical-align: middle;"><span th:text="${student.identity_card}"> Identity Card </span></td>
                        <td style="vertical-align: middle;"><span th:text="${student.address}"> Address </span></td>
                        <td style="text-align: center; vertical-align: middle;">
                            <div class="btn-group">
                                <a th:href="@{'/student/student_view/' + ${student.studentId}}" class="btn btn-info btn-sm">View</a>
                                <a th:href="@{'/student/student_update/' + ${student.studentId}}" class="btn btn-warning btn-sm" style="margin: 0 5px;">Edit</a>
                                <a th:href="@{'/student/deleteStudent/' + ${student.studentId}}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
