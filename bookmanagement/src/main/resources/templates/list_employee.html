<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="/_admin_fragments :: admin_head"></th:block>
    <title>Quản lý Nhân viên | Admin</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
</head>
<body>

    <div th:replace="/_admin_fragments :: admin_sidebar"></div>

    <div class="main-content">
        <div th:replace="/_admin_fragments :: admin_header"></div>

        <div class="page-container">
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; font-weight: 700;">QUẢN LÝ NHÂN VIÊN</h2>
                    <a class="btn btn-primary" th:href="@{/employee/employee_save}" style="background-color: #3498db; border: none;">
                        <i class="fas fa-plus"></i> ADD EMPLOYEE
                    </a>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name Employee</th>
                        <th>Identity Card</th>
                        <th>Address</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="employee : ${listEmployee}">
                        <td style="vertical-align: middle;"><span th:text="${employee.employeeId}"> ID </span></td>
                        <td style="vertical-align: middle;"><span th:text="${employee.name_employee}" style="font-weight: 600;"> Name </span></td>
                        <td style="vertical-align: middle;"><span th:text="${employee.identity_card}"> Identity Card </span></td>
                        <td style="vertical-align: middle;"><span th:text="${employee.address}"> Address </span></td>
                        <td style="text-align: center; vertical-align: middle;">
                            <div class="btn-group">
                                <a th:href="@{'/employee/employee_view/' + ${employee.employeeId}}" class="btn btn-info btn-sm">View</a>
                                <a th:href="@{'/employee/employee_update/' + ${employee.employeeId}}" class="btn btn-warning btn-sm" style="margin: 0 5px;">Edit</a>
                                <a th:href="@{'/employee/deleteEmployee/' + ${employee.employeeId}}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
