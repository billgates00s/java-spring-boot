<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin tài khoản | HC SHOP</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
    <th:block th:include="/_header"></th:block>
    <th:block th:include="/_menu"></th:block>
</header>

<main class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div style="font-size: 50px; color: #4682b4; margin-bottom: 15px;">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Thông tin tài khoản</h1>
            <p>Xin chào, <span th:text="${#request.userPrincipal.name}" style="font-weight: 700; color: var(--nav-bg);">Admin</span></p>
        </div>

        <div style="background: #f8faff; border: 1px solid #e1e8f0; padding: 20px; border-radius: 6px; margin-bottom: 25px;">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <span style="color: #666;">Tên đăng nhập:</span>
                    <span th:text="${#request.userPrincipal.name}" style="font-weight: 500;">admin</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <span style="color: #666;">Vai trò:</span>
                    <span style="font-weight: 500; color: #27ae60;">Thành viên chính thức</span>
                </div>
                <div th:if="${userInfo != null}" style="color: #444; font-size: 13px; font-family: monospace; white-space: pre-wrap; margin-top: 10px;" th:utext="${userInfo}"></div>
            </div>
        </div>

        <a th:href="@{/logout}" class="auth-btn" style="text-decoration: none; display: block; text-align: center; background-color: #e74c3c;">ĐĂNG XUẤT</a>
    </div>
</main>

<footer>
    <th:block th:include="/_footer"></th:block>
</footer>

</body>
</html>
