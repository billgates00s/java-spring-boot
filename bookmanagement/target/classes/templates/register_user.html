<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCSHOP ADMIN | Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="auth-body">

<div class="login-card animate-fade">
    <h1>HCSHOP ADMIN</h1>
    <p>Tạo tài khoản quản trị mới</p>

    <form th:action="@{/register_user}" method="POST">
        
        <div class="form-group">
            <input type="text" id="username" name="user_name" placeholder="Tên đăng nhập" required>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="pass_word" placeholder="Mật khẩu" required>
        </div>

        <button type="submit">Đăng ký ngay</button>
        
        <div class="footer-info">
            <p>&copy; 2026 SmashShop. All rights reserved.</p>
            <p style="margin-top: 10px;">
                Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
            </p>
        </div>
    </form>
</div>

</body>
</html>
