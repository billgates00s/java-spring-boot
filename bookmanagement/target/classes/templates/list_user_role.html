<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="/_admin_fragments :: admin_head"></th:block>
    <title>Quản lý User Role | Admin</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
</head>
<body>

    <div th:replace="/_admin_fragments :: admin_sidebar"></div>

    <div class="main-content">
        <div th:replace="/_admin_fragments :: admin_header"></div>

        <div class="page-container">
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; font-weight: 700;">QUẢN LÝ USER ROLE</h2>
                    <a class="btn btn-primary" th:href="@{/userRole/user_role_save}" style="background-color: #3498db; border: none;">
                        <i class="fas fa-plus"></i> ADD USER ROLE
                    </a>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role Name</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="userRole : ${listUserRole}">
                        <td style="vertical-align: middle;"><span th:text="${userRole.id}"> ID </span></td>
                        <td style="vertical-align: middle;"><span th:text="${userRole.user.user_name}" style="font-weight: 600;"> User </span></td>
                        <td style="vertical-align: middle;"><span th:text="${userRole.role.role_name}" class="badge" style="background-color: #f1c40f; color: #333;"> Role </span></td>
                        <td style="text-align: center; vertical-align: middle;">
                            <div class="btn-group">
                                <a th:href="@{'/userRole/user_role_view/' + ${userRole.id}}" class="btn btn-info btn-sm">View</a>
                                <a th:href="@{'/userRole/user_role_update/' + ${userRole.id}}" class="btn btn-warning btn-sm" style="margin: 0 5px;">Edit</a>
                                <a th:href="@{'/userRole/deleteUserRole/' + ${userRole.id}}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
