<div class="header-top" xmlns:th="http://www.thymeleaf.org">
    <div class="logo">
        <a th:href="@{/}">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div
                    style="background: white; color: #3498db; padding: 5px 10px; border-radius: 5px; font-weight: 900; font-size: 1.5rem;">
                    HC</div>
                <div style="color: white; font-weight: 900; font-size: 1.5rem; letter-spacing: -1px;">BOOK</div>
            </div>
        </a>
    </div>

    <div class="search-bar">
        <form th:action="@{/search}" method="get" style="display: flex; width: 100%;">
            <input type="text" name="keyword" placeholder="Tìm kiếm thương hiệu, sản phẩm...">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>
    </div>

    <div class="header-icons">
        <span>
            <i class="fas fa-phone-alt"></i>
            <strong>0776856066</strong>
        </span>

        <div class="account-btn">
            <i class="fas fa-user-circle"></i>
            <span th:text="${#request.userPrincipal == null ? 'Tài Khoản' : #request.userPrincipal.name}">Tài
                Khoản</span>

            <div class="account-dropdown-content">
                <th:block th:if="${#request.userPrincipal == null}">
                    <a th:href="@{/login}">Đăng nhập</a>
                    <a th:href="@{/register_user}">Đăng ký</a>
                </th:block>
                <th:block th:if="${#request.userPrincipal != null}">
                    <a th:href="@{/userInfo}">Thông tin tài khoản</a>
                    <a th:href="@{/admin}" th:if="${#request.isUserInRole('ROLE_ADMIN')}">Quản trị</a>
                    <a th:href="@{/logout}">Đăng xuất</a>
                </th:block>
            </div>
        </div>

        <span>
            <i class="fas fa-shopping-cart"></i>
            Giỏ Hàng (0)
        </span>
    </div>
</div>
