<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <th:block th:include="/_admin_fragments :: admin_head"></th:block>
    <title>Admin Dashboard</title>
</head>
<body>

    <!-- Sidebar -->
    <div th:replace="/_admin_fragments :: admin_sidebar"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div th:replace="/_admin_fragments :: admin_header"></div>

        <!-- Page Body -->
        <div class="page-container">
            <div class="status-message">
                Lỗi khi tải thống kê.
            </div>
            
            <div style="margin-top: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.5;">
                <i class="fas fa-chart-line" style="font-size: 100px; margin-bottom: 20px;"></i>
                <p>Welcome to Admin Dashboard, <span sec:authentication="name">Admin</span>!</p>
            </div>
        </div>
    </div>

    <!-- Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>

</body>
</html>
