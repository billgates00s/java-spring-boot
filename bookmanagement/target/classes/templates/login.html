<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Book Management</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

<div class="login-wrapper animate-fade" style="width: 100%; max-width: 400px; padding: 1rem;">
    <div class="select-wrapper glass" style="max-width: 100%; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="background: var(--primary); width: 60px; height: 60px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fa-solid fa-lock" style="color: white; font-size: 1.5rem;"></i>
            </div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; background: none; -webkit-text-fill-color: var(--text-main);">Sign In</h1>
            <p style="color: var(--text-muted);">Access the management portal</p>
        </div>

        <form th:action="@{/j_spring_security_check}" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
            
            <div th:if="${param.error}" class="animate-fade" style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; text-align: center;">
                Invalid username or password
            </div>

            <div th:if="${param.logout}" class="animate-fade" style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; text-align: center;">
                Successfully logged out
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" style="width: 100%; background: var(--bg-dark); border: 1px solid var(--glass-border); color: var(--text-main); padding: 0.75rem 1rem 0.75rem 2.8rem; border-radius: 0.75rem; outline: none;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-key" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" style="width: 100%; background: var(--bg-dark); border: 1px solid var(--glass-border); color: var(--text-main); padding: 0.75rem 1rem 0.75rem 2.8rem; border-radius: 0.75rem; outline: none;" required>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                <input type="checkbox" id="remember-me" name="remember-me" style="accent-color: var(--primary);">
                <label for="remember-me" style="margin-bottom: 0; cursor: pointer;">Remember me</label>
            </div>

            <button type="submit" style="margin-top: 0.5rem;">Log In</button>
            
            <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 1rem;">
                Don't have an account? <a th:href="@{/admin/register_user}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register now</a>
            </p>
        </form>
    </div>
</div>

</body>
</html>
