<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            HC SHOP
        </div>
        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/admin}" class="active">
                    <i class="fas fa-th-large"></i> Tổng quan
                </a>
            </li>
            <li>
                <a th:href="@{/category/category_list}">
                    <i class="fas fa-folder"></i> Danh mục
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-trademark"></i> Thương hiệu
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-tags"></i> Phân loại
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-percent"></i> Khuyến mãi
                </a>
            </li>
            <li>
                <a th:href="@{/book/book_list}">
                    <i class="fas fa-book"></i> Sản phẩm hiện có
                </a>
            </li>
            <li>
                <a th:href="@{/book/insert_book}">
                    <i class="fas fa-plus"></i> Thêm sản phẩm mới
                </a>
            </li>
            <li>
                <a th:href="@{/bookBorrow/bookBorrow_list}">
                    <i class="fas fa-shopping-cart"></i> Đơn hàng
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-history"></i> Lịch sử xóa đơn hàng
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-warehouse"></i> Quản lý tồn kho
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-star"></i> Đánh giá sản phẩm
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <!-- Empty for alignment -->
            </div>
            <h1>Admin Dashboard</h1>
            <div class="header-icons">
                <div class="header-icon">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="header-icon">
                    <i class="fas fa-envelope"></i>
                    <span class="badge">!</span>
                </div>
                <div class="header-icon" style="margin-left: 20px;">
                    <a th:href="@{/logout}" style="color: inherit; text-decoration: none;">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <div class="page-container">
            <div class="status-message">
                Lỗi khi tải thống kê.
            </div>

            <!-- Dashboard Content Placeholder -->
            <div
                style="margin-top: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.5;">
                <i class="fas fa-chart-line" style="font-size: 100px; margin-bottom: 20px;"></i>
                <p>Welcome to Admin Dashboard, <span sec:authentication="name">Admin</span>!</p>
            </div>
        </div>
    </div>

    <!-- Chat Button -->
    <div class="chat-button">
        <i class="fas fa-comment-dots"></i>
    </div>

</body>

</html>
